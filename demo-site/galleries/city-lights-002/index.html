<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Lights</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Georgia, "Times New Roman", serif;
      background: #f5efe6;
      color: #202020;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
    }

    .panel {
      padding: 20px;
      border: 1px solid #d8cabd;
      background: #fffdf9;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .chip {
      padding: 6px 10px;
      background: #e9ddd8;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 24px;
    }

    .thumb {
      width: 100%;
      height: 140px;
      object-fit: cover;
      background: linear-gradient(135deg, #c8cedf, #f3dfcc);
      display: block;
      border: 1px solid #e2d7ca;
    }
  </style>
</head>
<body>
  <main data-demo-role="gallery" data-demo-site="demo-site">
    <p><a href="../../index.html">Back to demo home</a></p>
    <section class="panel">
      <h1 data-demo-title="City Lights">City Lights</h1>
      <p data-demo-gallery-id="city-lights-002">Demo gallery ID: city-lights-002</p>
      <div class="chips">
        <span class="chip" data-demo-actor="Nina Vale">Nina Vale</span>
        <span class="chip" data-demo-tag="night">night</span>
        <span class="chip" data-demo-tag="city">city</span>
        <span class="chip" data-demo-category="urban">urban</span>
        <span class="chip" data-demo-studio="Studio Nova">Studio Nova</span>
      </div>
    </section>

    <section class="image-grid">
      <article data-demo-image="1">
        <img
          class="thumb"
          alt="City Lights image 1"
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240'%3E%3Crect width='400' height='240' fill='%23d8d6e7'/%3E%3Ctext x='200' y='125' text-anchor='middle' font-family='Georgia' font-size='28' fill='%23504b66'%3EImage 1%3C/text%3E%3C/svg%3E"
          data-demo-full="https://demo.example.test/media/city-lights-002/image-001.jpg">
      </article>
      <article data-demo-image="2">
        <img
          class="thumb"
          alt="City Lights image 2"
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240'%3E%3Crect width='400' height='240' fill='%23c9d5df'/%3E%3Ctext x='200' y='125' text-anchor='middle' font-family='Georgia' font-size='28' fill='%23504b66'%3EImage 2%3C/text%3E%3C/svg%3E"
          data-demo-full="https://demo.example.test/media/city-lights-002/image-002.jpg">
      </article>
    </section>
  </main>
</body>
</html>
