<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summer Escape</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Georgia, "Times New Roman", serif;
      background: #f7f1e6;
      color: #222;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
    }

    .meta,
    .image-grid article {
      border: 1px solid #dacbbd;
      background: #fffdf9;
    }

    .meta {
      padding: 20px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .chip {
      padding: 6px 10px;
      background: #f0e0d4;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 24px;
    }

    .image-grid article {
      padding: 14px;
    }

    .thumb {
      width: 100%;
      height: 140px;
      object-fit: cover;
      background: linear-gradient(135deg, #f2c6a8, #f8ead8);
      display: block;
      border: 1px solid #e2d7ca;
    }
  </style>
</head>
<body>
  <main data-demo-role="gallery" data-demo-site="demo-site">
    <p><a href="../../index.html">Back to demo home</a></p>
    <section class="meta">
      <h1 data-demo-title="Summer Escape">Summer Escape</h1>
      <p data-demo-gallery-id="summer-escape-001">Demo gallery ID: summer-escape-001</p>
      <div class="chips">
        <span class="chip" data-demo-actor="Alice Blue">Alice Blue</span>
        <span class="chip" data-demo-tag="outdoor">outdoor</span>
        <span class="chip" data-demo-tag="summer">summer</span>
        <span class="chip" data-demo-category="editorial">editorial</span>
        <span class="chip" data-demo-studio="Studio Nova">Studio Nova</span>
      </div>
    </section>

    <section class="image-grid">
      <article data-demo-image="1">
        <img
          class="thumb"
          alt="Summer Escape image 1"
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240'%3E%3Crect width='400' height='240' fill='%23f3ceb1'/%3E%3Ctext x='200' y='125' text-anchor='middle' font-family='Georgia' font-size='28' fill='%2372432a'%3EImage 1%3C/text%3E%3C/svg%3E"
          data-demo-full="https://demo.example.test/media/summer-escape-001/image-001.jpg">
      </article>
      <article data-demo-image="2">
        <img
          class="thumb"
          alt="Summer Escape image 2"
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240'%3E%3Crect width='400' height='240' fill='%23f0d9bc'/%3E%3Ctext x='200' y='125' text-anchor='middle' font-family='Georgia' font-size='28' fill='%2372432a'%3EImage 2%3C/text%3E%3C/svg%3E"
          data-demo-full="https://demo.example.test/media/summer-escape-001/image-002.jpg">
      </article>
      <article data-demo-image="3">
        <img
          class="thumb"
          alt="Summer Escape image 3"
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240'%3E%3Crect width='400' height='240' fill='%23eedfcf'/%3E%3Ctext x='200' y='125' text-anchor='middle' font-family='Georgia' font-size='28' fill='%2372432a'%3EImage 3%3C/text%3E%3C/svg%3E"
          data-demo-full="https://demo.example.test/media/summer-escape-001/image-003.jpg">
      </article>
    </section>
  </main>
</body>
</html>
