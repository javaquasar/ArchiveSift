name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  torrent-library-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install native UI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Build extension fixtures and verify the signed package manager on Linux
        run: |
          python scripts/test_extensions.py --prepare-only
          cargo test --locked -p archive-sift-extension-package --jobs 1
          cargo test --locked --test extension_manager --jobs 1
          cargo test --locked --lib disk_cache --jobs 1
          cargo test --locked --lib manager::tests --jobs 1
      - name: Torrent library integration tests on Linux
        run: cargo test --locked --test torrent_library
      - name: Torrent metadata export and attachment integration tests
        run: cargo test --locked --test torrent_description --test attachments --test preview_upgrade
      - name: Source-filtered date browsing
        run: cargo test --locked --test date_browse && cargo test --locked --lib date_browse
      - name: Shared director and author search with autocomplete
        run: cargo test --locked --test creator_search && cargo test --locked --lib creator
      - name: Adaptive search and lightweight torrent list regression tests
        run: cargo test --locked --test search_optimizations
      - name: Local agent access and real MCP stdio adapter tests
        run: cargo test --locked --test agent_control && cargo test --locked --lib agent
      - name: Recovery, path validation and headless card editor tests
        run: cargo test --locked --lib torrent
      - name: Configuration validation and completion integration tests
        run: cargo test --locked --test configuration
      - name: Headless JSON editor and full configuration apply tests
        run: cargo test --locked --lib configuration
      - run: cargo test --locked --lib raw_settings

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Build fixture plugins and production demo WASM module
        run: python scripts/test_extensions.py --prepare-only
      - name: Workspace tests including installed demo WASM parser
        run: cargo test --locked --workspace --jobs 1
      - name: Release build
        run: cargo build --locked --release --bins --jobs 1
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: archive-sift-windows
          path: |
            target/release/archive-sift.exe
            target/release/archive-sift-mcp.exe
            docs/AGENT_CONTROL.md
          if-no-files-found: error
