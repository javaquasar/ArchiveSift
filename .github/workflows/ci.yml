name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Build fixture plugins and production demo WASM module
        run: python scripts/test_extensions.py --prepare-only
      - name: Workspace tests including installed demo WASM parser
        run: cargo test --locked --workspace
      - name: Release build
        run: cargo build --locked --release
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: archive-sift-windows
          path: target/release/archive-sift.exe
          if-no-files-found: error
