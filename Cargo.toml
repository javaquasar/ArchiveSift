[package]
name = "archive-sift"
version = "0.2.0"
edition = "2021"
description = "A desktop content collector, downloader, and searchable local archive"
publish = false
default-run = "archive-sift"

[workspace]
members = ["crates/scraper-api", "plugins/demo-parser", "tools/plugin-packager"]
resolver = "2"

[lib]
name = "archive_sift"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls", "stream"] }
scraper = "0.23.1"
tokio = { version = "1", features = ["full", "rt-multi-thread", "macros"] }
select = "0.6.0"
futures = "0.3.31"
rayon = "1.10.0"
rusqlite = { version = "0.33.0", features = ["bundled"] }
eframe = "0.31.1"
rfd = "0.15.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
archive-sift-scraper-api = { path = "crates/scraper-api" }
wasmtime = { version = "36.0.19", default-features = false, features = ["std", "runtime", "cranelift", "component-model"] }
sha2 = "0.10"
semver = "1"
image = "0.25.9"
#tokio = "1.43.0"
arboard = "3"
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Security_Credentials",
] }

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[dev-dependencies]
tempfile = "3"
wat = "1.236"

[profile.dev]
debug = 0
