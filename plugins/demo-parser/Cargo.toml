[package]
name = "archive-sift-demo-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[features]
test-fixtures = []

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "archive-sift-demo-process"
path = "src/main.rs"

[dependencies]
archive-sift-scraper-api = { path = "../../crates/scraper-api" }
scraper = "0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "0.46", default-features = false, features = ["macros", "realloc", "std"] }
